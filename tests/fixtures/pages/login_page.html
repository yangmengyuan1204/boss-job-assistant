<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>登录页 - 测试fixture</title></head>
<body>
<div class="login-box">
  <div class="login-form">
    <form id="loginForm">
      <div class="form-group">
        <label>手机号</label>
        <input type="text" name="phone" placeholder="请输入手机号">
      </div>

        <label>验证码</label>

    </form>
  </div>
</div>
</body>
</html>
